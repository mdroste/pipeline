# Pipeline ships Tauri's current Linux WebKitGTK backend. Tauri 2.11 still
# depends on the gtk-rs GTK3 generation, whose crates are marked unmaintained.
# There is no drop-in GTK4/WebKit replacement in Tauri today. Keep these
# explicit so every other new informational advisory fails CI.
[advisories]
ignore = [
  "RUSTSEC-2024-0411", # gdkwayland-sys (Tauri Linux only)
  "RUSTSEC-2024-0412", # gdk (Tauri Linux only)
  "RUSTSEC-2024-0413", # atk (Tauri Linux only)
  "RUSTSEC-2024-0414", # gdkx11-sys (Tauri Linux only)
  "RUSTSEC-2024-0415", # gtk (Tauri Linux only)
  "RUSTSEC-2024-0416", # atk-sys (Tauri Linux only)
  "RUSTSEC-2024-0417", # gdkx11 (Tauri Linux only)
  "RUSTSEC-2024-0418", # gdk-sys (Tauri Linux only)
  "RUSTSEC-2024-0419", # gtk3-macros (Tauri Linux only)
  "RUSTSEC-2024-0420", # gtk-sys (Tauri Linux only)
  "RUSTSEC-2024-0370", # proc-macro-error via the GTK3 macros
  # glib 0.18's advisory concerns VariantStrIter. Pipeline never calls this
  # API; the crate is present only through Tauri's Linux GUI stack.
  "RUSTSEC-2024-0429",
  # urlpattern is a Tauri runtime/build dependency. Its UNIC crates are
  # unmaintained but have no reported vulnerability or replacement release.
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
]
informational_warnings = ["unmaintained", "unsound", "notice"]

[output]
deny = ["warnings"]
quiet = false
show_tree = true
