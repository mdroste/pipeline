[package]
name = "pipeline-gui"
version = "0.9.5"
description = "Desktop agent orchestration suite for academic research and review"
homepage = "https://github.com/mdroste/pipeline"
repository = "https://github.com/mdroste/pipeline"
license = "MIT"
edition = "2021"
rust-version = "1.88"
# Two bins (pipeline-gui + pipeline-cli); disambiguate `cargo run` / `tauri dev`.
default-run = "pipeline-gui"

[features]
# Compiles an embedded WebDriver server into CI-only test binaries. Official
# release artifacts do not enable this feature.
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[lib]
name = "pipeline_gui_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "pipeline-gui"
path = "src/main.rs"

[[bin]]
name = "pipeline-cli"
path = "src/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.54.0", default-features = false }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
ammonia = "4.1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "process", "time", "sync", "signal", "macros"] }
tempfile = "3"
dirs = "7"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
regex = "1"
sha2 = "0.11"
pulldown-cmark = "0.13"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
base64 = "0.23"
aes-gcm = "0.11"
getrandom = "0.4"
flate2 = "1"
tar = "0.4"
fs2 = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }

[dev-dependencies]
jsonschema = { version = "0.54.0", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# Full per-variable debuginfo made target/debug grow ~1 GB per rebuild cycle;
# line tables keep backtraces and profiling usable at a fraction of the size.
[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = true
panic = "unwind"
incremental = true
