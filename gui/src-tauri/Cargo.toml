[package]
name = "pipeline-gui"
version = "1.3.2"
description = "Desktop agent orchestration suite for academic research and review"
homepage = "https://github.com/mdroste/pipeline"
repository = "https://github.com/mdroste/pipeline"
license = "MIT"
edition = "2021"
rust-version = "1.90"
# Two bins (pipeline-gui + pipeline-cli); disambiguate `cargo run` / `tauri dev`.
default-run = "pipeline-gui"

[features]
# Compiles an embedded WebDriver server into CI-only test binaries. Official
# release artifacts do not enable this feature.
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[lib]
name = "pipeline_gui_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "pipeline-gui"
path = "src/main.rs"

[[bin]]
name = "pipeline-cli"
path = "src/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.49.9", default-features = false }

[dependencies]
jsonschema = { version = "0.49.9", default-features = false }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
ammonia = "4.2.4"
html5ever = "0.40.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "process", "time", "sync", "signal", "macros"] }
tempfile = "3"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
regex = "1"
quick-xml = "0.41"
sha2 = "0.10"
pulldown-cmark = "0.13.5"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
base64 = "0.22"
aes-gcm = "0.11"
getrandom = "0.4"
flate2 = "1"
tar = "0.4"
fs2 = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
lopdf = { version = "0.46", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Security"] }

# Full per-variable debuginfo made target/debug grow ~1 GB per rebuild cycle;
# line tables keep backtraces and profiling usable at a fraction of the size.
[profile.dev]
debug = "line-tables-only"
# Incremental state accumulated tens of GB across local rebuilds. Tests inherit
# this profile; dependencies still reuse ordinary Cargo build artifacts.
incremental = false

[profile.release]
strip = true
panic = "unwind"
incremental = false
