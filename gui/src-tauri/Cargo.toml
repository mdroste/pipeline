[package]
name = "pipeline-gui"
version = "1.0.2"
description = "Multi-pass referee report generator for academic economics papers"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "pipeline_gui_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "pipeline-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
ammonia = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "process", "time"] }
tempfile = "3"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
sha2 = "0.10"
pulldown-cmark = "0.10"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
base64 = "0.22"
aes-gcm = "0.10"
getrandom = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
