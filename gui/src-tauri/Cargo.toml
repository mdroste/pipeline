[package]
name = "pipeline-gui"
version = "1.5.0"
description = "Desktop agent orchestration suite for academic research and review"
homepage = "https://github.com/mdroste/pipeline"
repository = "https://github.com/mdroste/pipeline"
license = "MIT"
edition = "2021"
rust-version = "1.90"
# Two bins (pipeline-gui + pipeline-cli); disambiguate `cargo run` / `tauri dev`.
default-run = "pipeline-gui"

[features]
# Compiles an embedded WebDriver server into test binaries for `npm run test:e2e`,
# which runs by hand. Official release artifacts do not enable this feature.
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[lib]
name = "pipeline_gui_lib"
crate-type = ["lib"]

[[bin]]
name = "pipeline-gui"
path = "src/main.rs"

[[bin]]
name = "pipeline-cli"
path = "src/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.49.9", default-features = false }

[dependencies]
jsonschema = { version = "0.49.9", default-features = false }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
ammonia = "4.2.4"
html5ever = "0.40.1"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "process", "time", "sync", "signal", "macros", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
mxc-sdk = { version = "=1.0.1", default-features = false }
tempfile = "3"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
regex = "1"
quick-xml = "0.41"
sha2 = "0.10"
pulldown-cmark = "0.13.5"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
base64 = "0.22"
aes-gcm = "0.11"
getrandom = "0.4"
flate2 = "1"
tar = "0.4"
fs2 = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
lopdf = { version = "0.46", default-features = false }
trash = "5.2"
tiff = "0.11"
png = "0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_Registry", "Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes", "Win32_System_Rpc", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPrintInfo", "NSPrintOperation", "NSPrinter", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDictionary", "NSString", "NSURL", "NSGeometry", "NSObject"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-app-kit", "WKWebView"] }

[target.'cfg(target_os = "linux")'.dependencies]
fuse-backend-rs = { version = "=0.14.0", default-features = false, features = ["fusedev"] }
xattr = "1.7"
gtk = "0.18"
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

# Full per-variable debuginfo made target/debug grow ~1 GB per rebuild cycle;
# line tables keep backtraces and profiling usable at a fraction of the size.
[profile.dev]
debug = "line-tables-only"
# Incremental state accumulated tens of GB across local rebuilds. Tests inherit
# this profile; dependencies still reuse ordinary Cargo build artifacts.
incremental = false

[profile.release]
strip = true
panic = "unwind"
incremental = false
