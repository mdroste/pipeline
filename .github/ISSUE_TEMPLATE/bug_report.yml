name: Bug report
description: Report a problem with Pipeline
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and include a small example if possible. Remove private research and credentials from attachments. Use the Security tab to report a vulnerability privately.
  - type: input
    id: version
    attributes:
      label: Pipeline version
      description: Find this in Settings → Advanced & About.
      placeholder: "1.3.2"
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS 15 or later — Apple Silicon
        - macOS 15 or later — Intel
        - Windows 11 — x86-64
        - Windows 10 22H2 — x86-64
        - Ubuntu 22.04 or compatible Linux — x86-64
        - Unsupported or source-built platform
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation type
      options:
        - Official release installer
        - AppImage
        - Built from source
        - Development build
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Model provider and connection
      description: For example, ChatGPT subscription, Claude Code subscription, OpenAI API, or a local model server. Leave out keys and tokens.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a small example that contains no private research.
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Logs or error message
      description: Paste the relevant error or a short log excerpt with private information removed.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I reproduced this on the latest stable release.
          required: true
        - label: I removed confidential documents, credentials, tokens, usernames, and private paths.
          required: true
        - label: This is not an undisclosed security vulnerability.
          required: true
