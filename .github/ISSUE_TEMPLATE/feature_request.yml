name: Feature request
description: Suggest an improvement to Pipeline
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Tell us what you want to do and what would make it easier. Use examples you can share publicly.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it difficult?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What would you like Pipeline to do? An example helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: How do you handle this now?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Reviews
        - Projects and conversations
        - Providers and models
        - Document extraction
        - Reports and history
        - Interface and accessibility
        - CLI and automation
        - Packaging and release
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Before submitting
      options:
        - label: I checked existing issues for a similar request.
          required: true
