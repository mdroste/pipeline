name: Dependency advisories

# Checks the lockfiles against published advisories. It runs by itself so a new
# advisory is reported without stopping a pull request or a release. Accepted
# Rust advisories are listed in gui/src-tauri/.cargo/audit.toml.
on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24.18.0
  RUST_VERSION: 1.97.1
  CARGO_AUDIT_VERSION: 0.22.2

jobs:
  rust:
    name: Rust advisories
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install the pinned cargo-audit
        run: cargo install cargo-audit --version ${{ env.CARGO_AUDIT_VERSION }} --locked
      - name: Check Rust dependencies
        working-directory: gui/src-tauri
        run: cargo audit

  npm:
    name: JavaScript advisories
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check production JavaScript dependencies
        working-directory: gui
        run: npm audit --omit=dev
