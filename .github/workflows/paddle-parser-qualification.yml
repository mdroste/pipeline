name: Paddle parser qualification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paddle-parser-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Real parser (Linux x64)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Provision and exercise the checksum-locked real parser
        run: python scripts/release/qualify-paddle-parser.py
