name: Paddle parser qualification

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

concurrency:
  group: paddle-parser-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Real parser (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macOS arm64
          - os: windows-2022
            label: Windows x64
          - os: ubuntu-22.04
            label: Linux x64
          - os: ubuntu-24.04-arm
            label: Linux arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Provision and exercise the checksum-locked real parser
        run: python scripts/release/qualify-paddle-parser.py
