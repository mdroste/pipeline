name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24.18.0
  RUST_VERSION: 1.97.1
  CARGO_INCREMENTAL: 1

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Linux tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: gui/src-tauri -> target
          shared-key: tests-linux
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev ripgrep poppler-utils xvfb bubblewrap slirp4netns iproute2 iptables util-linux

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci --no-audit --no-fund

      - name: Prepare package notices
        working-directory: gui
        run: npm run prepare:release-resources

      - name: Check frontend formatting
        working-directory: gui
        run: npm run format:check

      - name: Enforce source size budget
        working-directory: gui
        run: npm run check:source-size

      - name: Check source ownership
        run: node --test gui/frontend-ownership.test.mjs scripts/command-surface.test.mjs scripts/runtime-ownership.test.mjs

      - name: Check documentation links
        working-directory: gui
        run: npm run check:links

      - name: Check documentation style
        working-directory: gui
        run: npm run check:docs

      - name: Check Rust formatting
        working-directory: gui/src-tauri
        run: cargo fmt --all -- --check

      - name: Frontend tests
        working-directory: gui
        run: npm test -- --run

      - name: Frontend production build
        working-directory: gui
        run: npm run build

      - name: Install Python for release tests
        id: release-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Release contract tests
        working-directory: gui
        env:
          PYTHON: ${{ steps.release-python.outputs.python-path }}
        run: npm run test:release

      - name: Strict Rust lint
        working-directory: gui/src-tauri
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Rust all-target tests
        working-directory: gui/src-tauri
        run: |
          cargo build --locked --bin pipeline-gui
          export PIPELINE_NATIVE_TEST_HELPER="$PWD/target/debug/pipeline-gui"
          echo "PIPELINE_NATIVE_TEST_HELPER=$PIPELINE_NATIVE_TEST_HELPER" >> "$GITHUB_ENV"
          cargo test --locked --all-targets

      - name: Native PDF export
        working-directory: gui/src-tauri
        run: |
          cargo build --locked --bin pipeline-gui
          export PIPELINE_TEST_PDF_EXECUTABLE="$PWD/target/debug/pipeline-gui"
          xvfb-run -a dbus-run-session -- cargo test --locked --lib native_renderer_exports_a_readable_multipage_pdf -- --ignored --nocapture

      - name: Native command isolation and proxy
        working-directory: gui/src-tauri
        run: |
          cargo test --locked --lib workbench::shell:: -- --include-ignored --skip linux_command_guard_entry --nocapture --test-threads=1

      - name: Pinned engine downloads
        working-directory: gui/src-tauri
        run: cargo test --locked --lib engines::download -- --ignored

  platform-tests:
    name: Native tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PIPELINE_LINK_TEST_MANIFEST: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: gui/src-tauri -> target
          shared-key: tests-${{ matrix.os }}
          cache-workspace-crates: true
          cache-on-failure: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Install embedded renderer resources
        working-directory: gui
        run: npm ci --no-audit --no-fund
      - name: Install pinned Poppler for Windows PDF tests
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bash scripts/release/bundle-poppler.sh windows
          cygpath -w "$PWD/gui/src-tauri/resources/poppler" >> "$GITHUB_PATH"
      - name: Install Poppler for macOS PDF tests
        if: runner.os == 'macOS'
        run: brew install poppler
      - name: Prepare package notices
        working-directory: gui
        run: npm run prepare:release-resources
      - name: Strict Windows Rust lint
        if: runner.os == 'Windows'
        working-directory: gui/src-tauri
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Native macOS command isolation and proxy
        if: runner.os == 'macOS'
        working-directory: gui/src-tauri
        run: |
          cargo test --locked --lib workbench::shell:: -- --include-ignored --skip linux_command_guard_entry --nocapture --test-threads=1

      - name: Native lifecycle and CLI tests
        working-directory: gui/src-tauri
        run: cargo test --locked --all-targets

      - name: Native PDF export
        working-directory: gui/src-tauri
        shell: bash
        run: |
          cargo build --locked --bin pipeline-gui
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # Git Bash prepends its own tools ahead of GITHUB_PATH entries.
            export PATH="$PWD/resources/poppler:$PATH"
            pdftotext -v
            export PIPELINE_TEST_PDF_EXECUTABLE="$(cygpath -w "$PWD/target/debug/pipeline-gui.exe")"
          else
            export PIPELINE_TEST_PDF_EXECUTABLE="$PWD/target/debug/pipeline-gui"
          fi
          cargo test --locked --lib native_renderer_exports_a_readable_multipage_pdf -- --ignored --nocapture
