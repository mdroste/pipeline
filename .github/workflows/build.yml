name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24.18.0
  RUST_VERSION: 1.97.1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Cargo audit
        working-directory: gui/src-tauri
        run: cargo audit

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install npm dependencies
        working-directory: gui
        run: npm ci

      # Only these dependencies are compiled into the shipped app, so a new
      # advisory here blocks the merge.
      - name: npm production dependency audit
        working-directory: gui
        run: npm audit --omit=dev --audit-level=low

      # The build and test chain (Vite, WebdriverIO, Tauri CLI) never ships in
      # an installer. Advisories there are reported for triage but do not gate
      # merges, so a fresh CVE five levels deep in the test tooling cannot turn
      # main red on its own. Real regressions still surface in the job summary.
      - name: npm build-chain advisory report
        working-directory: gui
        continue-on-error: true
        run: npm audit --audit-level=low

  # Pull requests validate on Linux only; pushes to main and manual runs cover
  # all four platforms. macOS runners bill at a 10x minute multiplier and
  # Dependabot opens several PRs at a time, so the full matrix is reserved for
  # the branch that actually ships. Cross-platform breakage lands on main rather
  # than in the PR — run the workflow manually against a branch before merging
  # anything platform-specific.
  test:
    name: Tests (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"os":"ubuntu-22.04","label":"Linux x64"}]'
          || '[{"os":"ubuntu-22.04","label":"Linux x64"},
          {"os":"windows-2022","label":"Windows x64"},
          {"os":"macos-15","label":"macOS arm64"},
          {"os":"macos-15-intel","label":"macOS x64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: gui/src-tauri -> target

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb

      - name: Install npm dependencies
        working-directory: gui
        run: npm ci

      - name: Release metadata tests
        working-directory: gui
        run: npm run test:release

      - name: Paddle full-parser sidecar contract
        run: python scripts/release/test-paddle-parser-sidecar.py

      - name: Cargo test
        working-directory: gui/src-tauri
        run: cargo test --locked --all-targets

      - name: Rust formatting
        working-directory: gui/src-tauri
        run: cargo fmt --check

      - name: Rust Clippy
        working-directory: gui/src-tauri
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Frontend tests
        working-directory: gui
        run: npm test

      - name: Frontend production build
        working-directory: gui
        run: npm run build

      - name: Build CI desktop executable
        working-directory: gui
        run: npm run tauri -- build --debug --no-bundle --features e2e --config src-tauri/tauri.e2e.conf.json --ci -- --locked

      - name: Compiled-app UI smoke (Linux)
        if: runner.os == 'Linux'
        working-directory: gui
        run: xvfb-run -a npm run test:e2e

      - name: Compiled-app UI smoke (macOS/Windows)
        if: runner.os != 'Linux'
        working-directory: gui
        run: npm run test:e2e

  msrv:
    name: Rust 1.88 minimum version
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: 1.88.0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm dependencies
        working-directory: gui
        run: npm ci

      - name: Check declared MSRV
        working-directory: gui/src-tauri
        run: cargo +1.88.0 check --locked
