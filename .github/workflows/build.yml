name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24.18.0
  RUST_VERSION: 1.97.1
  CARGO_INCREMENTAL: 1

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Linux tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: gui/src-tauri -> target
          shared-key: tests-linux
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev ripgrep

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci --no-audit --no-fund

      - name: Prepare package notices
        working-directory: gui
        run: npm run prepare:release-resources

      - name: Check frontend formatting
        working-directory: gui
        run: npm run format:check

      - name: Enforce source size budget
        working-directory: gui
        run: npm run check:source-size

      - name: Check documentation links
        working-directory: gui
        run: npm run check:links

      - name: Check documentation style
        working-directory: gui
        run: npm run check:docs

      - name: Check Rust formatting
        working-directory: gui/src-tauri
        run: cargo fmt --all -- --check

      - name: Frontend tests
        working-directory: gui
        run: npm test -- --run

      - name: Frontend production build
        working-directory: gui
        run: npm run build

      - name: Install Python for release tests
        id: release-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Release contract tests
        working-directory: gui
        env:
          PYTHON: ${{ steps.release-python.outputs.python-path }}
        run: npm run test:release

      - name: Strict Rust lint
        working-directory: gui/src-tauri
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Rust all-target tests
        working-directory: gui/src-tauri
        run: cargo test --locked --all-targets

      - name: Pinned engine downloads
        working-directory: gui/src-tauri
        run: cargo test --locked --lib engines::download -- --ignored

  platform-tests:
    name: Native tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: gui/src-tauri -> target
          shared-key: tests-${{ matrix.os }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Install embedded renderer resources
        working-directory: gui
        run: npm ci --no-audit --no-fund
      - name: Install pinned Poppler for Windows PDF tests
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bash scripts/release/bundle-poppler.sh windows
          cygpath -w "$PWD/gui/src-tauri/resources/poppler" >> "$GITHUB_PATH"
      - name: Prepare package notices
        working-directory: gui
        run: npm run prepare:release-resources
      - name: Native lifecycle and CLI tests
        working-directory: gui/src-tauri
        env:
          PIPELINE_LINK_TEST_MANIFEST: "1"
        run: cargo test --locked --all-targets
