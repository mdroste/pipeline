name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cargo audit
        working-directory: gui/src-tauri
        run: cargo audit

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install npm dependencies
        working-directory: gui
        run: npm ci

      - name: npm audit
        working-directory: gui
        run: npm audit --omit=dev

  test:
    name: Tests (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux x64
          - os: windows-2022
            label: Windows x64
          - os: macos-15
            label: macOS arm64
          - os: macos-15-intel
            label: macOS x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri -> target

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb

      - name: Install npm dependencies
        working-directory: gui
        run: npm ci

      - name: Release metadata tests
        working-directory: gui
        run: npm run test:release

      - name: Cargo test
        working-directory: gui/src-tauri
        run: cargo test

      - name: Rust formatting
        working-directory: gui/src-tauri
        run: cargo fmt --check

      - name: Rust Clippy
        working-directory: gui/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Frontend tests
        working-directory: gui
        run: npm test

      - name: Frontend production build
        working-directory: gui
        run: npm run build

      - name: Build CI desktop executable
        working-directory: gui
        run: npm run tauri -- build --debug --no-bundle --features e2e --config src-tauri/tauri.e2e.conf.json --ci

      - name: Compiled-app UI smoke (Linux)
        if: runner.os == 'Linux'
        working-directory: gui
        run: xvfb-run -a npm run test:e2e

      - name: Compiled-app UI smoke (macOS/Windows)
        if: runner.os != 'Linux'
        working-directory: gui
        run: npm run test:e2e

  msrv:
    name: Rust 1.88 minimum version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm dependencies
        working-directory: gui
        run: npm ci

      - name: Check declared MSRV
        working-directory: gui/src-tauri
        run: cargo check --locked
