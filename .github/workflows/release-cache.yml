name: Release cache

# A tag build can read only its own caches and the default branch's, so release
# dependency caches must be saved here. Keep the toolchain, environment, shared
# key, and Tauri build arguments matched to release.yml, or tag builds miss.
# Poppler stays out: its cache key doesn't track the Homebrew or apt version, so
# a cache kept alive here would stop new releases picking up Poppler updates.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-cache.yml
      - gui/src-tauri/Cargo.lock
      - gui/src-tauri/Cargo.toml
      - rust-toolchain.toml
  schedule:
    # An exact hit only restores the cache, which stops GitHub evicting it.
    - cron: '17 7 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24.18.0
  RUST_VERSION: 1.97.1
  CARGO_INCREMENTAL: 1

concurrency:
  group: release-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  warm:
    if: github.ref == 'refs/heads/main'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            name: macOS ARM
            runner: macos-15
            rust_target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin
          - id: macos-x64
            name: macOS Intel
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin
          - id: windows
            name: Windows
            runner: windows-2022
            rust_target: ""
            tauri_args: ""
          - id: linux
            name: Linux
            runner: ubuntu-22.04
            rust_target: ""
            tauri_args: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.rust_target }}

      - name: Restore Rust build cache
        id: rust-cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: gui/src-tauri -> target
          shared-key: release-${{ matrix.id }}

      - name: Install Node.js
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install Linux libraries
        if: matrix.id == 'linux' && steps.rust-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        if: steps.rust-cache.outputs.cache-hit != 'true'
        working-directory: gui
        run: npm ci --no-audit --no-fund

      - name: Compile dependencies as a release build does
        if: steps.rust-cache.outputs.cache-hit != 'true'
        working-directory: gui
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ startsWith(matrix.id, 'macos-') && '15.0' || '' }}
        run: npm run tauri -- build ${{ matrix.tauri_args }} --no-bundle -- --locked
