name: Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build from this release tag
        required: true
        default: macos-arm64
        type: choice
        options:
          - macos-arm64
          - macos-x64
          - windows
          - linux
          - all

permissions:
  contents: write

env:
  NODE_VERSION: 24.18.0
  RUST_VERSION: 1.97.1
  CARGO_INCREMENTAL: 1

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/build.yml

  prepare:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    environment:
      name: release
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate complete version history
        run: node scripts/release/validate-release-identity.mjs --tag "$GITHUB_REF_NAME"
      - name: Verify signed tag and prepare draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/draft-release.mjs prepare "$GITHUB_REF_NAME"

  package:
    needs: prepare
    if: github.ref_type == 'tag'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
    environment:
      name: ${{ matrix.id == 'windows' && 'windows-signing' || 'release' }}
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
          inputs.platform == 'all'
          && '[{"id":"macos-arm64","name":"macOS ARM","runner":"macos-15","rust_target":"aarch64-apple-darwin","tauri_args":"--target aarch64-apple-darwin","bundle":"app,dmg"},{"id":"macos-x64","name":"macOS Intel","runner":"macos-15-intel","rust_target":"x86_64-apple-darwin","tauri_args":"--target x86_64-apple-darwin","bundle":"app,dmg"},{"id":"windows","name":"Windows","runner":"windows-2022","rust_target":"","tauri_args":"","bundle":"nsis"},{"id":"linux","name":"Linux","runner":"ubuntu-22.04","rust_target":"","tauri_args":"","bundle":"appimage"}]'
          || inputs.platform == 'macos-arm64'
          && '[{"id":"macos-arm64","name":"macOS ARM","runner":"macos-15","rust_target":"aarch64-apple-darwin","tauri_args":"--target aarch64-apple-darwin","bundle":"app,dmg"}]'
          || inputs.platform == 'macos-x64'
          && '[{"id":"macos-x64","name":"macOS Intel","runner":"macos-15-intel","rust_target":"x86_64-apple-darwin","tauri_args":"--target x86_64-apple-darwin","bundle":"app,dmg"}]'
          || inputs.platform == 'windows'
          && '[{"id":"windows","name":"Windows","runner":"windows-2022","rust_target":"","tauri_args":"","bundle":"nsis"}]'
          || '[{"id":"linux","name":"Linux","runner":"ubuntu-22.04","rust_target":"","tauri_args":"","bundle":"appimage"}]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.rust_target }}

      # release-cache.yml saves this on main, the only cache a new tag can read.
      - name: Restore Rust build cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: gui/src-tauri -> target
          shared-key: release-${{ matrix.id }}
          save-if: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install Linux libraries
        if: matrix.id == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libfuse2 patchelf poppler-utils xvfb

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci --no-audit --no-fund

      - name: Restore bundled Poppler
        id: poppler-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gui/src-tauri/resources/poppler
          key: poppler-inventory-v2-${{ matrix.id }}-${{ hashFiles('scripts/release/bundle-poppler.sh', 'scripts/release/poppler-lock.json', 'scripts/release/poppler-inventory.mjs') }}

      - name: Bundle Poppler when not cached
        if: steps.poppler-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/release/bundle-poppler.sh "${{ matrix.id }}"

      - name: Verify bundled Poppler inventory (including cache hits)
        run: node scripts/release/poppler-inventory.mjs --verify

      - name: Import Apple signing certificate
        if: startsWith(matrix.id, 'macos-')
        uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c # v7.2.0
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Sign bundled Poppler
        if: startsWith(matrix.id, 'macos-')
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file_path; do
            if file "$file_path" | grep -q 'Mach-O'; then
              codesign --force --options runtime --timestamp \
                --sign "$APPLE_SIGNING_IDENTITY" "$file_path"
            fi
          done < <(find gui/src-tauri/resources/poppler -type f -print0)

      - name: Build signed and notarized macOS package
        if: startsWith(matrix.id, 'macos-')
        working-directory: gui
        env:
          PIPELINE_OFFICIAL_RELEASE: "1"
          PIPELINE_BUNDLE_PLATFORM: ${{ matrix.id }}
          PIPELINE_CLI_BINARY: target/${{ matrix.rust_target }}/release/pipeline-cli
          MACOSX_DEPLOYMENT_TARGET: "15.0"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Without this, Tauri skips the Finder step that arranges the window.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build ${{ matrix.tauri_args }} --bundles ${{ matrix.bundle }} --config '{"bundle":{"createUpdaterArtifacts":true}}' -- --locked

      - name: Verify the disk image layout
        if: startsWith(matrix.id, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$(find "gui/src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg" -type f -name '*.dmg' -print -quit)"
          bash scripts/release/verify-macos-dmg.sh "$dmg_path"

      - name: Check the macOS app's binaries, Poppler, and launch
        if: startsWith(matrix.id, 'macos-')
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.id == 'macos-arm64' && 'arm64' || 'x86_64' }}
        run: |
          set -euo pipefail
          app="gui/src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/Pipeline.app"
          poppler="$app/Contents/Resources/resources/poppler"
          bash scripts/release/validate-macos-machos.sh --root "$app" \
            --expected-arch "$EXPECTED_ARCH" --max-minos 15.0 --require-developer-id
          bash scripts/release/validate-macos-machos.sh --root "$poppler" \
            --expected-arch "$EXPECTED_ARCH" --max-minos 15.0 --poppler-layout --require-developer-id
          node scripts/release/smoke-poppler.mjs "$poppler"
          node scripts/release/smoke-packaged-app.mjs "$PWD/$app/Contents/MacOS/pipeline-gui"

      - name: Build unsigned package
        if: matrix.id == 'linux'
        working-directory: gui
        env:
          PIPELINE_OFFICIAL_RELEASE: "1"
          PIPELINE_BUNDLE_PLATFORM: ${{ matrix.id }}
          NO_STRIP: ${{ matrix.id == 'linux' && '1' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build ${{ matrix.tauri_args }} --bundles ${{ matrix.bundle }} --config '{"bundle":{"createUpdaterArtifacts":true}}' -- --locked

      - name: Check Poppler and launch the AppImage
        if: matrix.id == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find gui/src-tauri/target/release/bundle/appimage -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          node scripts/release/smoke-poppler.mjs gui/src-tauri/resources/poppler
          xvfb-run -a node scripts/release/smoke-packaged-app.mjs --process-stability-only "$PWD/$appimage"

      - name: Compile Windows application before signing login
        if: matrix.id == 'windows'
        working-directory: gui
        env:
          PIPELINE_OFFICIAL_RELEASE: "1"
          PIPELINE_BUNDLE_PLATFORM: windows
        run: npm run tauri -- build --no-bundle -- --locked

      - name: Authenticate Windows signing to Azure
        if: matrix.id == 'windows'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare Windows signing and sign bundled Poppler
        if: matrix.id == 'windows'
        shell: pwsh
        env:
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module ArtifactSigning -RequiredVersion 0.1.8 -Scope CurrentUser -Repository PSGallery -Force
          Get-ChildItem gui/src-tauri/resources/poppler -Recurse -File |
            Where-Object { $_.Extension -in @('.exe', '.dll') } |
            ForEach-Object {
              & ./scripts/release/windows-sign.ps1 -FilePath $_.FullName
              if (-not $?) { throw "Poppler signing failed: $($_.FullName)" }
            }
          node scripts/release/poppler-inventory.mjs windows
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inventory signed Poppler' }
          node scripts/release/prepare-windows-signing.mjs "$env:RUNNER_TEMP/windows-signing.json"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare signing configuration' }

      - name: Build signed Windows package
        if: matrix.id == 'windows'
        working-directory: gui
        shell: pwsh
        env:
          PIPELINE_OFFICIAL_RELEASE: "1"
          PIPELINE_BUNDLE_PLATFORM: windows
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- bundle --config "$env:RUNNER_TEMP/windows-signing.json" --bundles nsis

      - name: Verify Windows installer and installed signatures
        if: matrix.id == 'windows'
        shell: pwsh
        run: ./scripts/release/verify-windows-package.ps1 -InstallDirectory "$env:RUNNER_TEMP/pipeline-signature-check"

      - name: Upload immutable installer to draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.id }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          case "$PLATFORM" in
            macos-arm64)
              source_path="$(find gui/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -type f -name '*.dmg' -print -quit)"
              asset_name="Pipeline-${version}-macOS-AppleSilicon.dmg"
              update_path="$(find gui/src-tauri/target/aarch64-apple-darwin/release/bundle/macos -type f -name '*.app.tar.gz' -print -quit)"
              update_name="Pipeline-${version}-macOS-AppleSilicon.app.tar.gz"
              ;;
            macos-x64)
              source_path="$(find gui/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -type f -name '*.dmg' -print -quit)"
              asset_name="Pipeline-${version}-macOS-Intel.dmg"
              update_path="$(find gui/src-tauri/target/x86_64-apple-darwin/release/bundle/macos -type f -name '*.app.tar.gz' -print -quit)"
              update_name="Pipeline-${version}-macOS-Intel.app.tar.gz"
              ;;
            windows)
              source_path="$(find gui/src-tauri/target/release/bundle/nsis -type f -name '*setup.exe' -print -quit)"
              asset_name="Pipeline-${version}-Windows.exe"
              update_path="$source_path"
              update_name="$asset_name"
              ;;
            linux)
              source_path="$(find gui/src-tauri/target/release/bundle/appimage -type f -name '*.AppImage' -print -quit)"
              asset_name="Pipeline-${version}-Linux.AppImage"
              update_path="$source_path"
              update_name="$asset_name"
              ;;
          esac
          test -n "$source_path"
          test -s "$source_path"
          test -s "$update_path.sig"
          cp "$source_path" "$RUNNER_TEMP/$asset_name"

          node scripts/release/draft-release.mjs upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/$asset_name"

          # The in-app updater's package; Windows and Linux use the installer.
          if [ "$update_name" != "$asset_name" ]; then
            cp "$update_path" "$RUNNER_TEMP/$update_name"
            node scripts/release/draft-release.mjs upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/$update_name"
          fi
          cp "$update_path.sig" "$RUNNER_TEMP/$update_name.sig"
          node scripts/release/draft-release.mjs upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/$update_name.sig"

  verify-draft:
    name: Verify complete draft release
    needs: [quality, package]
    runs-on: ubuntu-22.04
    environment:
      name: release
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Publish the update manifest to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/draft-release.mjs manifest "$GITHUB_REF_NAME"
      - name: Verify all four installers, checksums, and update signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/draft-release.mjs verify "$GITHUB_REF_NAME"
      - name: Verify the draft holds exactly the expected assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json isDraft,assets > "$RUNNER_TEMP/release.json"
          node scripts/release/validate-release-assets.mjs --version "${GITHUB_REF_NAME#v}" --release-json "$RUNNER_TEMP/release.json"
      # Tags aren't protected, so check the tag again after the long build.
      - name: Verify the signed tag still points at this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/validate-signed-tag-binding.sh
