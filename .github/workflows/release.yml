name: Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build from this release tag
        required: true
        default: macos-arm64
        type: choice
        options:
          - macos-arm64
          - macos-x64
          - windows
          - linux
          - all

permissions:
  contents: write

env:
  NODE_VERSION: 24.18.0
  RUST_VERSION: 1.97.1
  CARGO_INCREMENTAL: 1

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.ref_type == 'tag'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
          inputs.platform == 'all'
          && '[{"id":"macos-arm64","name":"macOS ARM","runner":"macos-15","rust_target":"aarch64-apple-darwin","tauri_args":"--target aarch64-apple-darwin","bundle":"dmg"},{"id":"macos-x64","name":"macOS Intel","runner":"macos-15-intel","rust_target":"x86_64-apple-darwin","tauri_args":"--target x86_64-apple-darwin","bundle":"dmg"},{"id":"windows","name":"Windows","runner":"windows-2022","rust_target":"","tauri_args":"","bundle":"nsis"},{"id":"linux","name":"Linux","runner":"ubuntu-22.04","rust_target":"","tauri_args":"","bundle":"appimage"}]'
          || inputs.platform == 'macos-arm64'
          && '[{"id":"macos-arm64","name":"macOS ARM","runner":"macos-15","rust_target":"aarch64-apple-darwin","tauri_args":"--target aarch64-apple-darwin","bundle":"dmg"}]'
          || inputs.platform == 'macos-x64'
          && '[{"id":"macos-x64","name":"macOS Intel","runner":"macos-15-intel","rust_target":"x86_64-apple-darwin","tauri_args":"--target x86_64-apple-darwin","bundle":"dmg"}]'
          || inputs.platform == 'windows'
          && '[{"id":"windows","name":"Windows","runner":"windows-2022","rust_target":"","tauri_args":"","bundle":"nsis"}]'
          || '[{"id":"linux","name":"Linux","runner":"ubuntu-22.04","rust_target":"","tauri_args":"","bundle":"appimage"}]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Confirm release tag and version
        shell: bash
        run: node scripts/release/validate-release-identity.mjs --tag "$GITHUB_REF_NAME"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.rust_target }}

      - name: Restore Rust build cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: gui/src-tauri -> target
          shared-key: release-${{ matrix.id }}
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install Linux libraries
        if: matrix.id == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libfuse2 patchelf poppler-utils

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci --no-audit --no-fund

      - name: Restore bundled Poppler
        id: poppler-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gui/src-tauri/resources/poppler
          key: poppler-simple-v1-${{ matrix.id }}-${{ hashFiles('scripts/release/bundle-poppler.sh', 'scripts/release/poppler-lock.json') }}
          restore-keys: |
            poppler-simple-v1-${{ matrix.id }}-

      - name: Bundle Poppler when not cached
        if: steps.poppler-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/release/bundle-poppler.sh "${{ matrix.id }}"

      - name: Import Apple signing certificate
        if: startsWith(matrix.id, 'macos-')
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Sign bundled Poppler
        if: startsWith(matrix.id, 'macos-')
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file_path; do
            if file "$file_path" | grep -q 'Mach-O'; then
              codesign --force --options runtime --timestamp \
                --sign "$APPLE_SIGNING_IDENTITY" "$file_path"
            fi
          done < <(find gui/src-tauri/resources/poppler -type f -print0)

      - name: Build signed and notarized macOS package
        if: startsWith(matrix.id, 'macos-')
        working-directory: gui
        env:
          MACOSX_DEPLOYMENT_TARGET: "15.0"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri -- build ${{ matrix.tauri_args }} --bundles ${{ matrix.bundle }} -- --locked

      - name: Build unsigned package
        if: ${{ !startsWith(matrix.id, 'macos-') }}
        working-directory: gui
        env:
          NO_STRIP: ${{ matrix.id == 'linux' && '1' || '' }}
        run: npm run tauri -- build ${{ matrix.tauri_args }} --bundles ${{ matrix.bundle }} -- --locked

      - name: Upload installer and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.id }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          case "$PLATFORM" in
            macos-arm64)
              source_path="$(find gui/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -type f -name '*.dmg' -print -quit)"
              asset_name="Pipeline-${version}-macOS-AppleSilicon.dmg"
              ;;
            macos-x64)
              source_path="$(find gui/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -type f -name '*.dmg' -print -quit)"
              asset_name="Pipeline-${version}-macOS-Intel.dmg"
              ;;
            windows)
              source_path="$(find gui/src-tauri/target/release/bundle/nsis -type f -name '*setup.exe' -print -quit)"
              asset_name="Pipeline-${version}-Windows.exe"
              ;;
            linux)
              source_path="$(find gui/src-tauri/target/release/bundle/appimage -type f -name '*.AppImage' -print -quit)"
              asset_name="Pipeline-${version}-Linux.AppImage"
              ;;
          esac
          test -n "$source_path"
          test -s "$source_path"
          cp "$source_path" "$RUNNER_TEMP/$asset_name"

          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "Pipeline $GITHUB_REF_NAME" \
              --notes "Installers for Pipeline $GITHUB_REF_NAME. macOS builds are signed and notarized; Windows is intentionally unsigned."
          fi
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/$asset_name" --clobber
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi
