name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macOS-arm64
            rust_target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin
            expected_arch: arm64
            asset_arch: aarch64
            max_minos: "11.0"
          - os: macos-15-intel
            label: macOS-x64
            rust_target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin
            expected_arch: x86_64
            asset_arch: x64
            max_minos: "10.15"
          - os: ubuntu-22.04
            label: Linux
            rust_target: ""
            tauri_args: ""
            expected_arch: ""
            asset_arch: ""
            max_minos: ""
          - os: windows-latest
            label: Windows
            rust_target: ""
            tauri_args: ""
            expected_arch: ""
            asset_arch: ""
            max_minos: ""

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri -> target

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm dependencies
        working-directory: gui
        run: npm ci

      # Import the Apple signing cert early on macOS so the Bundle
      # poppler step can sign its Mach-O files with --timestamp before
      # Tauri picks them up. Without this, notarization rejects the
      # bundle ("binary is not signed with a valid Developer ID
      # certificate / secure timestamp") because Homebrew's poppler
      # binaries are unsigned and dylibbundler invalidates what was
      # there. tauri-action imports the cert again into its own
      # keychain for the main build; the two coexist fine.
      - name: Import Apple code-signing cert (macOS)
        if: startsWith(matrix.label, 'macOS')
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # Bundle a slimmed poppler so Claude Code's Read tool (which uses
      # pdftoppm to render PDFs) and Pipeline's pdftotext fallback work
      # out of the box. Source binaries are downloaded per-platform and
      # dropped into gui/src-tauri/resources/poppler/, which is bundled
      # by Tauri via tauri.conf.json `resources`.
      #
      # The output directory is cached per-platform so subsequent runs
      # skip the download/install (brew install on macOS is ~2 min by
      # itself). Cache invalidates when the workflow file changes.

      - name: Cache poppler bundle
        id: cache_poppler
        uses: actions/cache@v4
        with:
          path: gui/src-tauri/resources/poppler
          key: poppler-${{ matrix.label }}-${{ hashFiles('.github/workflows/release.yml') }}

      - name: Bundle poppler (macOS)
        if: startsWith(matrix.label, 'macOS') && steps.cache_poppler.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          brew install poppler dylibbundler
          poppler_bin="$(brew --prefix poppler)/bin"
          work=$(mktemp -d)
          cp "$poppler_bin/pdftoppm" "$work/"
          cp "$poppler_bin/pdftotext" "$work/"
          # dylibbundler follows each dylib's dependencies, but when a
          # reference uses @rpath (as Homebrew poppler's do for
          # libpoppler, libcairo, etc.) it doesn't know where to look.
          # Give it every brew opt/*/lib as a search path, and pipe
          # /dev/null to stdin so it fails fast instead of hanging on
          # an interactive "please specify the directory" prompt if
          # anything is still unresolvable.
          search_args=()
          for lib_dir in "$(brew --prefix)"/opt/*/lib; do
            [ -d "$lib_dir" ] && search_args+=(-s "$lib_dir")
          done
          (
            cd "$work"
            dylibbundler -od -b \
              -x ./pdftoppm -x ./pdftotext \
              -d ./lib -p '@loader_path/lib/' \
              "${search_args[@]}" </dev/null
          )
          dest="$GITHUB_WORKSPACE/gui/src-tauri/resources/poppler"
          mkdir -p "$dest/lib"
          cp "$work/pdftoppm" "$work/pdftotext" "$dest/"
          cp "$work/lib/"*.dylib "$dest/lib/"
          # Sign every Mach-O with Developer ID + hardened runtime +
          # secure timestamp. The cert was imported in a prior step.
          # Without this, notarization rejects the app because the
          # Homebrew originals are unsigned and dylibbundler's rewrites
          # invalidate any existing signatures.
          find "$dest" -type f | while read -r f; do
            if file "$f" | grep -q 'Mach-O'; then
              codesign --remove-signature "$f" 2>/dev/null || true
              codesign --force --options runtime --timestamp \
                --sign "${APPLE_SIGNING_IDENTITY}" "$f"
            fi
          done
          echo "Bundled poppler files:"
          ls -la "$dest"
          ls -la "$dest/lib"
          du -sh "$dest"
          # Sanity: confirm install names point at @loader_path and
          # that signatures are in place.
          otool -L "$dest/pdftoppm"
          codesign -dv "$dest/pdftoppm" 2>&1 | head -5 || true
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Bundle poppler (Linux)
        if: matrix.label == 'Linux' && steps.cache_poppler.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y poppler-utils patchelf
          dest="$GITHUB_WORKSPACE/gui/src-tauri/resources/poppler"
          mkdir -p "$dest/lib"
          cp "$(which pdftoppm)" "$dest/"
          cp "$(which pdftotext)" "$dest/"
          # Copy each binary's dynamic deps, skipping glibc-family libs that
          # must come from the host (bundling them across distro versions
          # causes loader conflicts).
          copy_deps() {
            local bin="$1"
            ldd "$bin" | awk '/=> \//{print $3}' | while read -r lib; do
              local name
              name=$(basename "$lib")
              case "$name" in
                ld-linux-*|libc.so.*|libdl.so.*|libpthread.so.*|libm.so.*|librt.so.*|libresolv.so.*|libnsl.so.*|libutil.so.*)
                  continue ;;
              esac
              cp -L "$lib" "$dest/lib/"
            done
          }
          copy_deps "$dest/pdftoppm"
          copy_deps "$dest/pdftotext"
          # Set rpath so the loader looks next to the binary first.
          patchelf --set-rpath '$ORIGIN/lib' "$dest/pdftoppm"
          patchelf --set-rpath '$ORIGIN/lib' "$dest/pdftotext"
          echo "Bundled poppler files:"
          ls -la "$dest"
          ls -la "$dest/lib"
          du -sh "$dest"

      - name: Bundle poppler (Windows)
        if: matrix.label == 'Windows' && steps.cache_poppler.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ver="25.12.0-0"
          url="https://github.com/oschwartz10612/poppler-windows/releases/download/v${ver}/Release-${ver}.zip"
          curl -L -o /tmp/poppler.zip "$url"
          mkdir -p /tmp/poppler
          unzip -q /tmp/poppler.zip -d /tmp/poppler
          inner=$(ls /tmp/poppler | head -1)
          src="/tmp/poppler/${inner}/Library/bin"
          dest="gui/src-tauri/resources/poppler"
          mkdir -p "$dest"
          cp "$src/pdftoppm.exe" "$dest/"
          cp "$src/pdftotext.exe" "$dest/"
          # Copy DLLs except Qt bindings (not used by pdftoppm/pdftotext).
          shopt -s nullglob
          for dll in "$src"/*.dll; do
            name=$(basename "$dll")
            case "$name" in
              Qt5*|Qt6*) continue ;;
            esac
            cp "$dll" "$dest/"
          done
          echo "Bundled poppler files:"
          ls -la "$dest"
          du -sh "$dest"

      - name: Extract version number
        id: version
        shell: bash
        run: echo "num=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build and release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code signing (optional — add secrets when ready)
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: gui
          tagName: ${{ github.ref_name }}
          releaseName: "Pipeline ${{ github.ref_name }}"
          releaseBody: |
            ## Download

            Pick the file for your platform, then see the instructions below.

            ### macOS
            - **Apple Silicon** (M1 / M2 / M3 / M4) → `Pipeline-${{ steps.version.outputs.num }}-macOS-AppleSilicon.dmg`
            - **Intel** → `Pipeline-${{ steps.version.outputs.num }}-macOS-Intel.dmg`

            Not sure which? Apple menu → About This Mac → look at **Chip**.

            Open the `.dmg` and drag Pipeline into your Applications folder, then launch from Applications.

            ### Windows
            Download `Pipeline-${{ steps.version.outputs.num }}-Windows.exe` and double-click to install.

            **Windows SmartScreen / Smart App Control:** Pipeline is not yet signed for Windows, so Windows will block the installer.

            Try these in order:

            1. **Unblock the file.** Right-click the downloaded `.exe` → **Properties** → tick **Unblock** at the bottom of the *General* tab → **OK**. Then run the installer. This usually clears the warning.
            2. **If it's still blocked, turn off Smart App Control.** Open **Windows Security → App & browser control → Smart App Control** and switch it to **Off**. Install Pipeline, then turn Smart App Control back on.

            Only do this for software you trust.

            ### Linux
            Download `Pipeline-${{ steps.version.outputs.num }}-Linux.AppImage`, make it executable (`chmod +x <file>`), then run it. Works on any modern Linux distro — no package manager needed.

            ---

            ### Requirements
            Pipeline uses [Claude Code](https://claude.com/claude-code) under the hood. Install Claude Code first; then launch Pipeline.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.tauri_args }}

      - name: Verify macOS artifact architecture
        if: startsWith(matrix.label, 'macOS')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          RUST_TARGET: ${{ matrix.rust_target }}
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          MAX_MINOS: ${{ matrix.max_minos }}
        shell: bash
        run: |
          set -euo pipefail

          release_dir="gui/src-tauri/target/${RUST_TARGET}/release"
          app_path="${release_dir}/bundle/macos/Pipeline.app"
          if [ ! -d "${app_path}" ]; then
            echo "Pipeline.app was not produced at ${app_path}"
            find gui/src-tauri/target -path '*/release/bundle/macos/Pipeline.app' -type d -print
            exit 1
          fi

          exe="${app_path}/Contents/MacOS/pipeline-gui"
          actual_arch="$(lipo -archs "${exe}")"
          if [ "${actual_arch}" != "${EXPECTED_ARCH}" ]; then
            echo "Expected ${EXPECTED_ARCH} executable, got: ${actual_arch}"
            file "${exe}"
            exit 1
          fi

          minos="$(otool -l "${exe}" | awk '/LC_BUILD_VERSION/{show=1} show && /minos/{print $2; exit}')"
          if ! awk -v actual="${minos}" -v max="${MAX_MINOS}" 'BEGIN { split(actual,a,"."); split(max,m,"."); exit ! ((a[1] < m[1]) || (a[1] == m[1] && a[2] <= m[2])) }'; then
            echo "Executable minimum macOS ${minos} is higher than expected ${MAX_MINOS}"
            otool -l "${exe}" | awk '/LC_BUILD_VERSION/{show=1} show && /(platform|minos|sdk)/{print} show && /sdk/{exit}'
            exit 1
          fi

          if ! plutil -p "${app_path}/Contents/Info.plist" | grep -q '"LSRequiresCarbon" => false'; then
            echo "Info.plist must not require Carbon"
            plutil -p "${app_path}/Contents/Info.plist"
            exit 1
          fi

          dmg_dir="${release_dir}/bundle/dmg"
          if [ ! -d "${dmg_dir}" ]; then
            echo "DMG output directory was not produced at ${dmg_dir}"
            find gui/src-tauri/target -path '*/release/bundle/dmg' -type d -print
            exit 1
          fi

          dmg_path="$(find "${dmg_dir}" -name "Pipeline_*_${ASSET_ARCH}.dmg" -type f | head -1)"
          if [ -z "${dmg_path}" ]; then
            echo "Expected Pipeline_*_${ASSET_ARCH}.dmg was not produced"
            find gui/src-tauri/target -maxdepth 6 -type f -name '*.dmg' -print
            exit 1
          fi

          echo "Notarizing and stapling ${dmg_path}"
          xcrun notarytool submit "${dmg_path}" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait
          xcrun stapler staple "${dmg_path}"
          xcrun stapler validate "${dmg_path}"

          spctl_output="$(spctl -a -vvv -t open --context context:primary-signature "${dmg_path}" 2>&1 || true)"
          echo "${spctl_output}"
          if ! grep -q 'source=Notarized Developer ID' <<<"${spctl_output}"; then
            echo "DMG was not accepted as a notarized Developer ID disk image"
            exit 1
          fi

          # tauri-action uploads the DMG before this post-build check runs.
          # Replace that uploaded asset with the notarized and stapled copy
          # before the later rename step gives it its public download name.
          gh release upload "${TAG}" "${dmg_path}#$(basename "${dmg_path}")" --clobber

          mount_dir="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -mountpoint "${mount_dir}" "${dmg_path}"
          trap 'hdiutil detach "${mount_dir}" >/dev/null 2>&1 || true; rmdir "${mount_dir}" >/dev/null 2>&1 || true' EXIT

          dmg_exe="${mount_dir}/Pipeline.app/Contents/MacOS/pipeline-gui"
          if [ ! -f "${dmg_exe}" ]; then
            echo "Pipeline.app executable was not found inside the DMG"
            find "${mount_dir}" -maxdepth 4 -print
            exit 1
          fi

          dmg_arch="$(lipo -archs "${dmg_exe}")"
          if [ "${dmg_arch}" != "${EXPECTED_ARCH}" ]; then
            echo "Expected ${EXPECTED_ARCH} executable inside DMG, got: ${dmg_arch}"
            file "${dmg_exe}"
            exit 1
          fi

          dmg_minos="$(otool -l "${dmg_exe}" | awk '/LC_BUILD_VERSION/{show=1} show && /minos/{print $2; exit}')"
          if ! awk -v actual="${dmg_minos}" -v max="${MAX_MINOS}" 'BEGIN { split(actual,a,"."); split(max,m,"."); exit ! ((a[1] < m[1]) || (a[1] == m[1] && a[2] <= m[2])) }'; then
            echo "DMG executable minimum macOS ${dmg_minos} is higher than expected ${MAX_MINOS}"
            otool -l "${dmg_exe}" | awk '/LC_BUILD_VERSION/{show=1} show && /(platform|minos|sdk)/{print} show && /sdk/{exit}'
            exit 1
          fi

          if ! plutil -p "${mount_dir}/Pipeline.app/Contents/Info.plist" | grep -q '"LSRequiresCarbon" => false'; then
            echo "Info.plist inside DMG must not require Carbon"
            plutil -p "${mount_dir}/Pipeline.app/Contents/Info.plist"
            exit 1
          fi

          echo "Verified ${app_path}"
          file "${exe}"
          otool -l "${exe}" | awk '/LC_BUILD_VERSION/{show=1} show && /(platform|minos|sdk)/{print} show && /sdk/{exit}'
          plutil -p "${app_path}/Contents/Info.plist" | grep LSMinimumSystemVersion
          echo "Verified ${dmg_path}"
          file "${dmg_exe}"

      - name: Rename release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.num }}
          TAG: ${{ github.ref_name }}
          LABEL: ${{ matrix.label }}
        shell: bash
        run: |
          set -euo pipefail

          # Note: /releases/tags/{tag} does NOT return draft releases,
          # so we list all releases and filter by tag in jq. Also retry
          # up to ~60s because freshly-uploaded assets sometimes take
          # tens of seconds to appear in the release listing on the
          # Windows runner (the GitHub Releases API appears to be
          # eventually consistent).
          lookup_asset_id() {
            local name="$1"
            local asset_id=""
            for attempt in $(seq 1 20); do
              asset_id=$(gh api "/repos/${GITHUB_REPOSITORY}/releases" \
                --jq ".[] | select(.tag_name == \"${TAG}\") | .assets[] | select(.name == \"${name}\") | .id" \
                2>/dev/null || true)
              if [[ "${asset_id}" =~ ^[0-9]+$ ]]; then
                echo "${asset_id}"
                return 0
              fi
              sleep 3
            done
            return 1
          }

          rename_asset() {
            local old_name="$1"
            local new_name="$2"
            local asset_id
            if asset_id=$(lookup_asset_id "${old_name}"); then
              echo "Renaming ${old_name} → ${new_name}"
              gh api -X PATCH "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
                -f name="${new_name}" > /dev/null
            else
              echo "Skip rename: ${old_name} not found after retries (may not exist for this platform)"
            fi
          }

          # Tauri produces updater tarballs (.app.tar.gz and .sig) on
          # macOS whenever signing is configured, regardless of whether
          # "updater" is in bundle.targets. Since we don't ship an
          # in-app updater, these files just clutter the release page.
          # Each macOS job deletes its own.
          delete_asset() {
            local name="$1"
            local asset_id
            if asset_id=$(lookup_asset_id "${name}"); then
              echo "Deleting ${name}"
              gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > /dev/null
            else
              echo "Skip delete: ${name} not found (already gone or never created)"
            fi
          }

          case "${LABEL}" in
            "macOS-arm64")
              rename_asset "Pipeline_${VERSION}_aarch64.dmg" \
                           "Pipeline-${VERSION}-macOS-AppleSilicon.dmg"
              delete_asset "Pipeline_aarch64.app.tar.gz"
              delete_asset "Pipeline_aarch64.app.tar.gz.sig"
              ;;
            "macOS-x64")
              rename_asset "Pipeline_${VERSION}_x64.dmg" \
                           "Pipeline-${VERSION}-macOS-Intel.dmg"
              delete_asset "Pipeline_x64.app.tar.gz"
              delete_asset "Pipeline_x64.app.tar.gz.sig"
              ;;
            "Windows")
              rename_asset "Pipeline_${VERSION}_x64-setup.exe" \
                           "Pipeline-${VERSION}-Windows.exe"
              ;;
            "Linux")
              rename_asset "Pipeline_${VERSION}_amd64.AppImage" \
                           "Pipeline-${VERSION}-Linux.AppImage"
              ;;
          esac
