version: 2

# Check each ecosystem once a month. Pull requests run the normal CI checks.
#
# Caveat: Dependabot security updates are OFF for this repository, so these
# scheduled version bumps are the only automatic route for a vulnerability fix
# and a monthly cadence delays one by up to a month. Turning on "Dependabot
# security updates" (Settings -> Code security) opens advisory-driven PRs
# immediately, independent of the schedule below, and is the reason this cadence
# is safe to slow down.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /gui
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(npm)"
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /gui/src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(cargo)"
    groups:
      rust:
        patterns:
          - "*"
        # Cargo's 0.x minor releases can break APIs. Group only patches;
        # leave minor and major upgrades as individual migration PRs.
        update-types:
          - "patch"
