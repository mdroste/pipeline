[package]
name = "pipeline-windows-network-harness"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
mxc-sdk = { version = "=1.0.1", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
flatbuffers = "=25.12.19"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Environment", "Win32_System_Memory", "Win32_System_Com"] }

[workspace]
